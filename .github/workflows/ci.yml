name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: xpand
          POSTGRES_PASSWORD: xpand-ci
          POSTGRES_DB: xpand_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U xpand -d xpand_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://xpand:xpand-ci@localhost:5432/xpand_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: server
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - name: Unit + integration tests with coverage gates
        run: npm run test:coverage -w server
      - run: npm run build -w web

  docker:
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          push: false
          tags: xpand-portal:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Migrate image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: migrate
          push: false
          tags: xpand-portal-migrate:ci
          cache-from: type=gha
