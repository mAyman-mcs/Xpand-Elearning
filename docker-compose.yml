# Production stack for the EC2 host: Caddy (HTTPS) → app → Postgres, on a private network;
# a one-shot migrate container runs before the app on every `up`.
# Only Caddy publishes ports. See docs/DEPLOY.md.
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Applies pending migrations, then exits; the app starts only if it succeeded.
  migrate:
    build:
      context: .
      target: migrate
    image: xpand-portal-migrate:latest
    env_file: ${ENV_FILE:-.env}
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: .
      target: runtime
    image: xpand-portal:latest
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./ops/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  pgdata:
  caddy-data:
  caddy-config:
